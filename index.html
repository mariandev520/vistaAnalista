function rng(seed){let s=seed>>>0;return()=>{s=(Math.imul(s,1664525)+1013904223)>>>0;return s/4294967296}}

const data = STORES.map((s,idx)=>{

  const start = Math.floor(r()*CLIENTES.length);
  const marcas = Array.from({length:cant},(_,k)=>{
    const cl = CLIENTES[(start+k)%CLIENTES.length];
    const items = cl.skus.map(sk=>{
      let stock = Math.floor(r()*18);
      if(r()<0.13) stock = 0;
      const face = stock===0?0:Math.max(1,Math.min(4,Math.round(r()*4)));
      const precio = Math.round(sk.sug*(0.94+r()*0.16)/50)*50;
      return {...sk, col:cl.cols[cl.skus.indexOf(sk)%cl.cols.length], stock, face, precio,
        oferta:r()<0.14&&stock>0, dev:(precio/sk.sug-1)*100};
    });
    const quiebres = items.filter(i=>i.stock===0).length;
    const cumpl = Math.max(45, Math.min(100, Math.round(100 - quiebres*14 - r()*16)));
    return {cl, items, quiebres, cumpl};
  });
  const quiebres = marcas.reduce((a,m)=>a+m.quiebres,0);
  const cumpl = Math.round(marcas.reduce((a,m)=>a+m.cumpl,0)/marcas.length);
  const devProm = marcas.flatMap(m=>m.items).reduce((a,b,_,arr)=>a+b.dev/arr.length,0);
  const dias = 1+Math.floor(r()*11);
  const last = new Date(HOY); last.setDate(HOY.getDate()-dias);
  const next = new Date(HOY); next.setDate(HOY.getDate()+1+Math.floor(r()*6));
  const st = quiebres>=3?'crit':(quiebres>=1||cumpl<75?'warn':'ok');
  const rep = EQUIPO[Math.floor(r()*EQUIPO.length)];
  return {...s, id:'s'+idx, slug:slug(s.n), marcas, quiebres, cumpl, devProm, last, next, dias, st, rep,
    hora:(9+Math.floor(r()*9))+':'+String(Math.floor(r()*60)).padStart(2,'0'),
    frecuencia:['2 visitas por semana','3 visitas por semana','1 visita por semana'][Math.floor(r()*3)]};
});

/* esquema de góndola de una marca */
function planograma(marca,w,h,shelves){
  const items = marca.items, per = Math.ceil(items.length/shelves);
  const padX=14, padY=12, sh=(h-padY*2)/shelves;
  let out=`<svg class="pg" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Góndola de ${esc(marca.cl.n)}"><rect width="${w}" height="${h}" fill="#F2F4F3"/>`;
  let k=0;
  for(let s=0;s<shelves;s++){
    const y=padY+s*sh+sh-8;
    out+=`<rect x="${padX-5}" y="${y}" width="${w-padX*2+10}" height="3" fill="#D5DBD6"/>`;
    let x=padX;
    items.slice(s*per,(s+1)*per).forEach(it=>{
      const bw=16,gap=3;
      if(it.stock===0){
        out+=`<rect class="hole" x="${x}" y="${y-32}" width="${bw*2+gap}" height="32" fill="none" stroke="#B8503F" stroke-width="1.1" stroke-dasharray="3 2" rx="2"/><text x="${x+(bw*2+gap)/2}" y="${y-13}" font-family="Inter,sans-serif" font-size="7.5" fill="#B8503F" text-anchor="middle">HUECO</text>`;
        x+=bw*2+gap+9; return;
      }
      const n=Math.max(1,it.face);
      for(let i=0;i<n;i++){
        const bh=25+(i%2?4:0);
        out+=`<rect class="b" x="${x}" y="${y-bh}" width="${bw}" height="${bh}" rx="2" fill="${it.col}" style="animation-delay:${k*38}ms"/>`;
        x+=bw+gap; k++;
      }
      out+=`<text x="${x-n*(bw+gap)}" y="${y+11}" font-family="Inter,sans-serif" font-size="7" fill="#9AA09A">${it.c}</text>`;
      x+=9;
    });
  }
  return out+'</svg>';
}
const planoTienda = (s,w,h,sh)=>planograma(s.marcas[0],w,h,sh);

function post(el){
  requestAnimationFrame(()=>{
    el.querySelectorAll('[data-w]').forEach(b=>b.style.width=b.dataset.w+'%');
    el.querySelectorAll('.stagger > *').forEach((n,i)=>n.style.animationDelay=Math.min(i*32,320)+'ms');
    el.querySelectorAll('[data-to]').forEach(n=>{
      const to=parseFloat(n.dataset.to), dec=+(n.dataset.dec||0), sg=n.dataset.sign==='1', t0=performance.now();
      (function step(t){const q=Math.min(1,(t-t0)/850),e=1-Math.pow(1-q,3);
        n.textContent=(sg&&to>=0?'+':'')+(to*e).toFixed(dec); if(q<1) requestAnimationFrame(step);})(t0);
    });
  });
  el.querySelectorAll('[data-slot]').forEach(n=>n.addEventListener('click',()=>{
    const [sid,num]=n.dataset.slot.split('|'); const s=data.find(x=>x.id===sid);
    if(hayFoto(s,num)){ $('#lbImg').src=fotoSrc(s,num); $('#lb').classList.add('on'); }

  el.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{
    vista=b.dataset.tab;
    el.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-selected',x.dataset.tab===vista));

  }));
}

PAGES.precios = ()=>{

    const prom=ps.reduce((a,b)=>a+b,0)/ps.length;
    filas.push({cli:c, sk, prom, min:Math.min(...ps), max:Math.max(...ps), dev:(prom/sk.sug-1)*100, n:ps.length});

  <div class="kpi"><div class="k">Sin responder</div><div class="v ${ab.length?'neg':''}"><span data-to="${ab.length}">0</span></div><div class="m">${BANDEJA.filter(h=>h.estado==='nuevo').length} sin abrir</div></div>
  <div class="kpi"><div class="k">Vencen hoy</div><div class="v ${ven.length?'neg':''}">${ven.length}</div><div class="m">dentro de la jornada</div></div>
  <div class="kpi"><div class="k">Esperando al cliente</div><div class="v">${BANDEJA.filter(h=>h.estado==='esperando').length}</div><div class="m">con respuesta enviada</div></div>
  <div class="kpi"><div class="k">Resueltas hoy</div><div class="v pos">${BANDEJA.filter(h=>h.estado==='resuelto').length}</div><div class="m">tiempo medio 1 h 40 min</div></div>
</div>
${ab.some(h=>h.cat==='reclamo')?`<div class="callout red"><span class="ce">🔴</span><div><b>${ab.filter(h=>h.cat==='reclamo').length} reclamos de tienda abiertos.</b> Son los que más rápido escalan a la marca — conviene resolverlos primero.</div></div>`:''}
${BANDEJA.some(h=>h.cat==='armado'&&h.estado!=='resuelto')?`<div class="callout brand"><span class="ce">📦</span><div><b>${BANDEJA.filter(h=>h.cat==='armado'&&h.estado!=='resuelto').length} armados en curso.</b> Cada uno necesita confirmar cantidades, material POP y repositor antes de la fecha.</div></div>`:''}
<div id="inbFilters"></div>
<div id="inbList"></div>`;
};
function drawInbox(){
  const fb=$('#inbFilters'), el=$('#inbList'); if(!el) return;
  const chip=(k,l,cur,attr)=>`<button class="fchip ${cur===k?'on':''}" data-${attr}="${k}">${l}</button>`;
  fb.innerHTML=`<div class="inbf">
    ${chip('todos','Todos los canales',inbCanal,'fcanal')}${Object.entries(CANALES).map(([k,v])=>chip(k,v.i+' '+v.t,inbCanal,'fcanal')).join('')}
  </div>
  <div class="inbf">
    ${chip('todas','Todas las categorías',inbCat,'fcat')}${Object.entries(CATS).map(([k,v])=>chip(k,v.t,inbCat,'fcat')).join('')}
  </div>`;
  const list=BANDEJA.filter(h=>(inbCanal==='todos'||h.canal===inbCanal)&&(inbCat==='todas'||h.cat===inbCat));
  const ord={alta:0,normal:1};
  const g=(t,arr)=>arr.length?`<div class="regh">${t}<span class="n">${arr.length}</span></div>${arr.map(hiloRow).join('')}`:'';
  const ab=list.filter(h=>h.estado==='nuevo'||h.estado==='responder').sort((a,b)=>(ord[a.prio]-ord[b.prio])||((a.sla??99)-(b.sla??99)));
  const esp=list.filter(h=>h.estado==='esperando');
  const res=list.filter(h=>h.estado==='resuelto');
  el.innerHTML=(g('Requieren tu respuesta',ab)+g('Esperando al cliente',esp)+g('Resueltas',res))
    || '<p class="p" style="color:var(--light);padding:20px 0">No hay conversaciones con este filtro.</p>';
}
function openHilo(id){
  const h=BANDEJA.find(x=>x.id===id); if(!h) return;
  const ca=CANALES[h.canal];
  if(h.estado==='nuevo') h.estado='responder';
  const vinc = h.cli?`<span class="pill ${h.cli.col}" data-cli="${h.cli.slug}">${h.cli.e} ${esc(h.cli.n)}</span>`
    : h.store?`<span class="pill ghost" data-store="${h.store.id}">${h.store.ic} ${esc(h.store.n)}</span>`:'—';
  const qr=QR[h.cat]||QR.interno;
  $('#peekBody').innerHTML=`
    <div class="picon">${ca.i}</div><h1>${esc(h.asunto)}</h1>
    <div class="props">
      <div class="prow"><span class="pkey">💬 Canal</span><span class="pval"><span class="pill ${ca.c}">${ca.i} ${ca.t}</span></span></div>
      <div class="prow"><span class="pkey">👤 De</span><span class="pval"><span class="person"><span class="av">${h.de.ini}</span>${esc(h.de.n)}</span> · ${esc(h.de.rol)}</span></div>
      <div class="prow"><span class="pkey">◉ Categoría</span><span class="pval"><span class="pill ${CATS[h.cat].c}">${CATS[h.cat].t}</span></span></div>
      <div class="prow"><span class="pkey">🔗 Vínculo</span><span class="pval">${vinc}</span></div>
      <div class="prow"><span class="pkey">🧑‍💼 Asignado a</span><span class="pval"><span class="person"><span class="av g">VS</span>${esc(h.asignado)}</span></span></div>
      <div class="prow"><span class="pkey">◉ Estado</span><span class="pval"><span class="pill ${HEST[h.estado].c}">${HEST[h.estado].t}</span></span></div>
      ${h.sla!=null?`<div class="prow"><span class="pkey">⏱ SLA de respuesta</span><span class="pval ${h.sla<=4?'neg':''}">${h.sla<=0?'Vencido':'Responder dentro de '+h.sla+' h'}</span></div>`:''}
    </div>
    ${h.cat==='reclamo'?`<div class="callout red"><span class="ce">🔴</span><div>Reclamo de tienda. Si no se resuelve en el día, el encargado suele escalarlo directo a la marca.</div></div>`:''}
    ${h.armado?`<h3 class="h3">📦 Checklist de armado</h3>
    <div class="armchk">
      <div style="font-size:13px;color:var(--muted);margin-bottom:6px">${esc(h.armado.lugar)} · ${esc(h.armado.fecha)}</div>
      ${h.armado.items.map(it=>`<div class="ai"><span class="ck ${it.ok?'on':'off'}">${it.ok?'✓':''}</span>
        <span style="flex:1">${esc(it.n)}${it.sku&&it.sku.length<=6?` <span style="color:var(--light);font-size:12px">${esc(it.sku)}</span>`:''}</span>
        <span style="color:var(--muted);font-size:12.5px">${esc(it.qty)}</span></div>`).join('')}
      <div class="cbar">
        <button class="qr" data-toast="Se enviaría el pedido a depósito">Pedir a depósito</button>
        <button class="qr" data-toast="Se asignaría repositor y fecha">Asignar repositor</button>
        <button class="qr" data-toast="Se generaría la orden de armado">Generar orden</button>
      </div>
    </div>`:''}
    <h3 class="h3">💬 Conversación</h3>
    <div class="conv" id="hiloConv">${h.msgs.map(m=>`<div class="msg ${m.q==='nos'?'nos':'ellos'}">
      <div class="mh">${m.q==='nos'?'Vos':esc(h.de.n)} · ${relhora(m.at)}</div>${esc(m.txt)}</div>`).join('')}</div>
    <div class="composer">
      <textarea id="hiloTa" placeholder="Escribí la respuesta para ${ca.t}…"></textarea>
      <div class="cbar">
        ${qr.map(t=>`<button class="qr" data-qr="${esc(t)}">${esc(t)}</button>`).join('')}
        <button class="csend" id="hiloSend">Enviar por ${ca.t}</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
      <button class="btng" data-hres>✓ Marcar resuelto</button>
      <button class="btng" data-hrep>＋ Crear reporte de campo</button>
      <button class="btng" data-toast="Se reasignaría la conversación">Reasignar</button>
    </div>`;
  const body=$('#peekBody'), ta=body.querySelector('#hiloTa');
  body.querySelectorAll('[data-qr]').forEach(b=>b.addEventListener('click',()=>{ ta.value=b.dataset.qr; ta.focus(); }));
  body.querySelector('#hiloSend').addEventListener('click',()=>{
    const v=ta.value.trim(); if(!v) return toast('Escribí una respuesta');
    body.querySelector('#hiloConv').insertAdjacentHTML('beforeend',
      `<div class="msg nos"><div class="mh">Vos · ahora</div>${esc(v)}</div>`);
    ta.value=''; h.estado='esperando'; toast('Respuesta enviada por '+ca.t);
    body.querySelector('#hiloConv').lastElementChild.scrollIntoView({block:'nearest'});
    $('#inbKbd').textContent=inbAbiertas().length;
  });
  body.querySelectorAll('[data-hres]').forEach(b=>b.addEventListener('click',()=>{
    h.estado='resuelto'; toast('Conversación marcada como resuelta');
    $('#inbKbd').textContent=inbAbiertas().length; closePeek(); if(PAGE==='inbox') render('inbox');
  }));
  body.querySelectorAll('[data-hrep]').forEach(b=>b.addEventListener('click',()=>toast('Se abriría un reporte con el contexto de esta conversación')));
  abrirPeek();
  $('#inbKbd').textContent=inbAbiertas().length;
  if(PAGE==='inbox') drawInbox();
}

/* ==================== PANELES ==================== */
function openTienda(id){
  const s=data.find(x=>x.id===id); if(!s) return;
  const reps=feed.filter(f=>f.store.id===s.id);
  $('#peekBody').innerHTML=`
    <div class="picon">${s.ic}</div><h1>${esc(s.n)}</h1>
    <div class="props">
      <div class="prow"><span class="pkey">◉ Cadena</span><span class="pval"><span class="pill ${s.col}">${s.cad}</span> <span class="pill">${s.f}</span></span></div>
      <div class="prow"><span class="pkey">◉ Estado</span><span class="pval"><span class="pill ${ESTADO[s.st].c}">${ESTADO[s.st].t}</span></span></div>
      <div class="prow"><span class="pkey">📍 Dirección</span><span class="pval">${esc(s.z)} · Mar del Plata</span></div>
      <div class="prow"><span class="pkey">🔁 Frecuencia</span><span class="pval">${s.frecuencia}</span></div>
      <div class="prow"><span class="pkey">👤 Repositor asignado</span><span class="pval"><span class="person"><span class="av g">${s.rep.ini}</span>${esc(s.rep.n)}</span> · ${esc(s.rep.zona)}</span></div>
      <div class="prow"><span class="pkey">📅 Última visita</span><span class="pval">${fLarga(s.last)}, ${s.hora} · hace ${s.dias} ${s.dias===1?'día':'días'}</span></div>
      <div class="prow"><span class="pkey">📅 Próxima visita</span><span class="pval">${fLarga(s.next)}</span></div>
      <div class="prow"><span class="pkey"># Planograma</span><span class="pval num ${s.cumpl>=85?'pos':s.cumpl<70?'neg':''}">${s.cumpl}%</span></div>
    </div>
    ${s.quiebres
      ? `<div class="callout red"><span class="ce">🔴</span><div><b>${s.quiebres} SKU sin stock</b> en ${s.marcas.filter(m=>m.quiebres).length} marcas: ${s.marcas.filter(m=>m.quiebres).map(m=>m.cl.n).join(', ')}.</div></div>`
      : `<div class="callout brand"><span class="ce">✅</span><div>Sin quiebres en la última visita. Las ${s.marcas.length} marcas están completas en góndola.</div></div>`}
    <h3 class="h3">📸 Fotos de la última visita</h3>
    <div class="slots">${[1,2,3].map(n=>`<button class="slot" data-slot="${s.id}|${n}">
      <span class="im">${hayFoto(s,n)?imgOFallback(s,n,112):(n===1?planoTienda(s,300,112,1):`<span class="ph"><b>＋</b>Sin foto<br><code>${s.slug}-${n}.jpg</code></span>`)}</span>
      <span class="cap"><b>${TIPOS[n-1]}</b>${hayFoto(s,n)?'Tocá para ampliar':'Tocá para elegir del disco'}</span></button>`).join('')}</div>
    <h3 class="h3">🤝 Marcas relevadas acá</h3>
    ${s.marcas.map(m=>`<div style="border:1px solid var(--border);border-radius:10px;padding:13px;margin-bottom:10px">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:8px">
        <span style="font-size:17px">${m.cl.e}</span><b>${esc(m.cl.n)}</b>
        <span class="pill ${m.cl.plan==='Full'?'brand':'ghost'}">${m.cl.plan}</span>
        <span style="margin-left:auto" class="pill ${m.cumpl>=85?'green':m.cumpl<70?'red':'yellow'}">${m.cumpl}% planograma</span>
      </div>
      <div style="border-radius:7px;overflow:hidden;border:1px solid var(--line)">${planograma(m,600,110,1)}</div>
      <table style="margin-top:8px"><tbody>
      ${m.items.map(it=>`<tr><td class="tt" style="width:46%"><span class="row-title"><span style="width:9px;height:9px;border-radius:3px;background:${it.col};display:inline-block;flex:0 0 9px"></span><span>${it.n}</span></span></td>
        <td class="num">${it.stock===0?'<span class="pill red">Quiebre</span>':it.stock<=3?`<span class="pill yellow">${it.stock} u.</span>`:it.stock+' u.'}</td>
        <td class="num">${money(it.precio)}</td>
        <td class="num ${it.dev>2?'neg':it.dev<-2?'pos':''}">${it.dev>=0?'+':''}${it.dev.toFixed(1)}%</td></tr>`).join('')}
      </tbody></table>
    </div>`).join('')}
    <h3 class="h3">📋 Reportes en esta tienda</h3>
    ${reps.map(f=>`<div class="rep"><span class="av">${f.rep.ini}</span><div>
      <div class="h"><span class="who">${esc(f.rep.n)}</span><span class="pill ${f.col}">${f.tipo}</span><span class="pill ${f.cli.col}">${f.cli.e}</span><span class="when">${fCorta(f.fecha)} · ${f.hora}</span></div>
      <p>${esc(f.texto)}</p></div></div>`).join('') || '<p class="p" style="color:var(--light)">Sin reportes cargados.</p>'}`;
  abrirPeek();
}
function openCliente(sl){
  const c=clientes.find(x=>x.slug===sl); if(!c) return;
  $('#peekBody').innerHTML=`
    <div class="picon">${c.e}</div><h1>${esc(c.n)}</h1>
    <div class="props">
      <div class="prow"><span class="pkey">◉ Rubro</span><span class="pval"><span class="pill ${c.col}">${esc(c.cat)}</span></span></div>
      <div class="prow"><span class="pkey">◉ Plan contratado</span><span class="pval"><span class="pill ${c.plan==='Full'?'brand':'ghost'}">${c.plan}</span></span></div>
      <div class="prow"><span class="pkey">📅 Cliente desde</span><span class="pval">${fLarga(c.alta)} de ${c.alta.getFullYear()}</span></div>
      <div class="prow"><span class="pkey">🏪 Tiendas asignadas</span><span class="pval">${c.filas.length} de ${data.length}</span></div>
      <div class="prow"><span class="pkey">📦 SKU relevados</span><span class="pval">${c.skusTot} (${c.skus.length} por tienda)</span></div>
      <div class="prow"><span class="pkey">📋 Reportes del mes</span><span class="pval">${c.reportes} · ${c.fotos} fotos</span></div>
      <div class="prow"><span class="pkey"># Cumplimiento</span><span class="pval num ${c.cumpl>=85?'pos':c.cumpl<70?'neg':''}">${c.cumpl}% de planograma</span></div>
    </div>
    ${c.quiebres
      ? `<div class="callout red"><span class="ce">🔴</span><div><b>${c.quiebres} SKU sin stock</b> repartidos en ${c.filas.filter(f=>f.m.quiebres).length} tiendas. Se informa en el reporte semanal.</div></div>`
      : `<div class="callout brand"><span class="ce">✅</span><div>Sin quiebres abiertos en toda la plaza.</div></div>`}
    <h3 class="h3">📦 Productos bajo servicio</h3>
    <table><thead><tr><th style="width:48%"><span class="ph">Aa</span>Producto</th><th><span class="ph">#</span>Sugerido</th><th><span class="ph">#</span>En quiebre</th></tr></thead><tbody>
    ${c.skus.map(sk=>{const q=c.filas.filter(f=>f.m.items.find(i=>i.c===sk.c)?.stock===0).length;
      return `<tr><td class="tt"><span class="row-title"><span>${sk.n}</span></span><span style="color:var(--light);font-size:12px">${sk.c}</span></td>
      <td class="num">${money(sk.sug)}</td><td class="num ${q?'neg':''}">${q} tiendas</td></tr>`}).join('')}
    </tbody></table>
    <h3 class="h3">🏪 Tienda por tienda</h3>
    ${c.filas.map(f=>`<button class="ccard" data-store="${f.s.id}">
      <span class="em">${f.s.ic}</span>
      <span style="flex:1;min-width:0"><span class="t" style="display:block">${esc(f.s.n)}</span>
      <span class="m" style="display:block">${f.s.cad} · ${f.m.quiebres} quiebres · ${f.s.rep.n.split(' ')[0]} · ${fCorta(f.s.last)}</span>
      <span class="meter" style="max-width:300px"><i data-w="${f.m.cumpl}"></i></span></span>
      <span class="r"><span class="big ${f.m.cumpl>=85?'pos':f.m.cumpl<70?'neg':''}">${f.m.cumpl}%</span><span class="lbl">góndola</span></span>
    </button>`).join('')}`;
  abrirPeek();
}
function abrirPeek(){
  [...$('#peekBody').children].forEach((n,k)=>n.style.animationDelay=Math.min(k*30,300)+'ms');
  $('#peek').classList.add('on'); $('#peek').setAttribute('aria-hidden','false');
  $('#scrim').classList.add('on'); $('#peekBody').scrollTop=0; post($('#peekBody'));
}
function closePeek(){ $('#peek').classList.remove('on'); $('#peek').setAttribute('aria-hidden','true'); $('#scrim').classList.remove('on'); }
$('#peekClose').addEventListener('click',closePeek);
$('#scrim').addEventListener('click',closePeek);
$('#lbClose').addEventListener('click',()=>$('#lb').classList.remove('on'));
$('#lb').addEventListener('click',e=>{ if(e.target.id==='lb') $('#lb').classList.remove('on'); });

window.addEventListener('hashchange',()=>{ const p=location.hash.slice(1); if(PAGES[p]&&p!==PAGE) render(p); });
render(location.hash.slice(1)||'resumen');
</script>
</body>
</html>
